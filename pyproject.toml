[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-research"
version = "0.1.0"
description = "Scaffold for AI trading research with agents, strategies, backtests, and data workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Trading Team" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
